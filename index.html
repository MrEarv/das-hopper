<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ROM-Hopper Backup</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: white; padding: 20px; text-align: center; }
        .card { background-color: #2d2d2d; padding: 20px; border-radius: 8px; margin-top: 20px; }
        button { background-color: #0078D7; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; }
        button:hover { background-color: #005A9E; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status { margin-top: 15px; color: #aaa; }
        .success { color: #4CAF50 !important; font-weight: bold; }
    </style>
</head>
<body>
    <h1>ROM-Hopper ADB Tool</h1>
    <div class="card">
        <h3 id="device-status">Estado: Buscando dispositivo...</h3>
        <button id="btn-backup" disabled>⬇️ Hacer Backup de WhatsApp</button>
        <p id="status">Por favor, conecta tu dispositivo y activa la Depuración USB.</p>
    </div>

    <!-- Conectamos la lógica del frontend -->
    <script src="./renderer.js"></script>
</body>
</html>
